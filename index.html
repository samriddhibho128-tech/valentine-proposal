<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samriddhi ❤️ Nilanjan</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(-45deg,#ff4e8b,#ff0080,#ff7eb3,#ffb6c1);
background-size:400% 400%;
animation: gradientBG 10s ease infinite;
overflow:hidden;
font-family:'Poppins',sans-serif;
color:white;
text-align:center;
}

@keyframes gradientBG{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.container{
max-width:600px;
padding:30px;
}

h1{
font-family:'Playfair Display',serif;
font-size:2.7rem;
margin-bottom:20px;
animation: float 2s ease-in-out infinite alternate;
}

@keyframes float{
from{transform:translateY(0);}
to{transform:translateY(-8px);}
}

p{
font-size:1.1rem;
margin-bottom:25px;
opacity:0.9;
}

/* Buttons */
button{
padding:12px 28px;
font-size:18px;
border:none;
border-radius:40px;
cursor:pointer;
margin:10px;
transition:0.3s;
}

#yesBtn{
background:white;
color:#ff0080;
font-weight:bold;
box-shadow:0 0 15px rgba(255,255,255,0.6);
}

#noBtn{
background:black;
color:white;
position:absolute;
}

/* Hearts floating */
.heart{
position:absolute;
bottom:-20px;
font-size:20px;
animation: rise 6s linear infinite;
opacity:0.8;
}

@keyframes rise{
0%{transform:translateY(0); opacity:1;}
100%{transform:translateY(-110vh); opacity:0;}
}

/* Final Screen */
#finalScreen{
display:none;
animation: fadeIn 1s ease forwards;
}

@keyframes fadeIn{
from{opacity:0;}
to{opacity:1;}
}

.names{
font-family:'Playfair Display',serif;
font-size:2.5rem;
margin-bottom:15px;
animation: zoomIn 1.5s ease forwards;
}

@keyframes zoomIn{
from{transform:scale(0.5); opacity:0;}
to{transform:scale(1); opacity:1;}
}

#loveMessage{
margin-top:20px;
min-height:100px;
font-size:1.1rem;
white-space:pre-line;
}
</style>
</head>

<body>

<div class="container" id="mainScreen">
<h1>Nilanjan 💕</h1>
<p>Will you be my Valentine and stay with me forever? 💍</p>

<button id="yesBtn">YES 💖</button>
<button id="noBtn">NO 🙈</button>
</div>

<div class="container" id="finalScreen">
<div class="names">Samriddhi ❤️ Nilanjan</div>
<div id="loveMessage"></div>
</div>

<script>
const yesBtn=document.getElementById("yesBtn");
const noBtn=document.getElementById("noBtn");
const mainScreen=document.getElementById("mainScreen");
const finalScreen=document.getElementById("finalScreen");
const loveMessage=document.getElementById("loveMessage");

let yesSize=18;

/* Floating Hearts */
for(let i=0;i<40;i++){
let heart=document.createElement("div");
heart.classList.add("heart");
heart.innerHTML="💖";
heart.style.left=Math.random()*100+"vw";
heart.style.animationDuration=(4+Math.random()*4)+"s";
heart.style.fontSize=(15+Math.random()*25)+"px";
document.body.appendChild(heart);
}

/* NO button moves */
noBtn.addEventListener("mouseover",()=>{
noBtn.style.top=Math.random()*400+"px";
noBtn.style.left=Math.random()*400+"px";
yesSize+=5;
yesBtn.style.fontSize=yesSize+"px";
});

/* YES clicked */
yesBtn.addEventListener("click",()=>{
mainScreen.style.display="none";
finalScreen.style.display="block";
document.body.style.background="linear-gradient(135deg,#ff0080,#ffd700)";
typeMessage();
celebration();
});

/* Typing effect */
const message=`From the moment you entered my life,
everything became more beautiful.

You are my happiness,
my comfort,
my forever.

I choose you.
Today.
Tomorrow.
Always. 💖`;

function typeMessage(){
let i=0;
let speed=40;
function typing(){
if(i<message.length){
loveMessage.innerHTML+=message.charAt(i);
i++;
setTimeout(typing,speed);
}
}
typing();
}

/* Celebration */
function celebration(){
for(let i=0;i<50;i++){
let heart=document.createElement("div");
heart.classList.add("heart");
heart.innerHTML="💘";
heart.style.animationDuration="3s";
heart.style.left=Math.random()*100+"vw";
document.body.appendChild(heart);
setTimeout(()=>heart.remove(),3000);
}
}
</script>

</body>
</html>
