<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samriddhi ❤️ Nilanjan</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    background: linear-gradient(135deg,#ff4e8b,#ff9acb);
    overflow-x:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
    transition:1s;
}

/* Floating Hearts */
.heart{
    position:absolute;
    bottom:-50px;
    font-size:20px;
    animation: floatUp 8s linear infinite;
    opacity:0.8;
}

@keyframes floatUp{
    0%{transform: translateY(0);}
    100%{transform: translateY(-110vh);}
}

/* Card */
.card{
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(15px);
    padding:40px;
    border-radius:20px;
    box-shadow:0 0 40px rgba(255,255,255,0.4);
    max-width:600px;
}

/* Buttons */
button{
    padding:12px 25px;
    margin:10px;
    border:none;
    border-radius:30px;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

#yesBtn{
    background:#ff0055;
    color:white;
    box-shadow:0 0 15px #ff0055;
}

#yesBtn:hover{
    transform:scale(1.1);
}

#noBtn{
    background:white;
    color:#ff0055;
    position:relative;
}

/* Proposal Section */
#proposal{
    display:none;
    margin-top:20px;
}

/* Names Animation */
.names{
    font-size:2.2rem;
    font-weight:bold;
    margin-bottom:10px;
    animation: zoomIn 2s ease forwards;
}

@keyframes zoomIn{
    from{transform:scale(0); opacity:0;}
    to{transform:scale(1); opacity:1;}
}

/* Slideshow */
.slideshow{
    width:100%;
    height:300px;
    position:relative;
    margin-top:20px;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 0 25px rgba(255,255,255,0.6);
}

.slideshow img{
    width:100%;
    height:100%;
    object-fit:cover;
    position:absolute;
    opacity:0;
    transition:opacity 1s ease-in-out;
}

/* Love Letter */
#loveLetter{
    margin-top:20px;
    font-size:1.1rem;
    min-height:120px;
    white-space:pre-line;
}

/* Teddy */
.teddy{
    position:absolute;
    width:100px;
    bottom:20px;
    animation:bounce 3s infinite;
}

.left{ left:20px; }
.right{ right:20px; }

@keyframes bounce{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-20px);}
}

/* Firework */
.firework{
    position:absolute;
    font-size:25px;
    animation: explode 1s ease-out forwards;
}

@keyframes explode{
    from{transform:scale(0); opacity:1;}
    to{transform:scale(2); opacity:0;}
}
</style>
</head>

<body>

<!-- Floating Hearts -->
<script>
for(let i=0;i<35;i++){
    let heart=document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML="💖";
    heart.style.left=Math.random()*100+"vw";
    heart.style.animationDuration=(5+Math.random()*5)+"s";
    heart.style.fontSize=(15+Math.random()*25)+"px";
    document.body.appendChild(heart);
}
</script>

<!-- Teddy Bears -->
<img src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif" class="teddy left">
<img src="https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif" class="teddy right">

<div class="card">
    <h1>Nilanjan 💕</h1>
    <p>Will you be my Valentine and forever mine? 💍</p>

    <button id="yesBtn">YES 💖</button>
    <button id="noBtn">NO 😢</button>

    <div id="proposal">
        <div class="names">Samriddhi ❤️ Nilanjan</div>

        <!-- Slideshow with Your Photos -->
        <div class="slideshow">
            <img src="1000093984.jpg" class="slide" style="opacity:1;">
            <img src="1000093983.jpg" class="slide">
            <img src="1000093980.jpg" class="slide">
            <img src="1000093979.jpg" class="slide">
        </div>

        <!-- Love Letter -->
        <div id="loveLetter"></div>
    </div>
</div>

<script>
const yesBtn=document.getElementById("yesBtn");
const noBtn=document.getElementById("noBtn");
const proposal=document.getElementById("proposal");
const slides=document.querySelectorAll(".slide");
const loveLetter=document.getElementById("loveLetter");

yesBtn.addEventListener("click",()=>{
    proposal.style.display="block";
    document.body.style.background="linear-gradient(135deg,#ff0055,#ffd700)";
    startSlideshow();
    typeLetter();
    fireworks();
});

noBtn.addEventListener("mouseover",()=>{
    noBtn.style.position="absolute";
    noBtn.style.top=Math.random()*80+"%";
    noBtn.style.left=Math.random()*80+"%";
});

/* Slideshow */
let index=0;
function startSlideshow(){
    setInterval(()=>{
        slides[index].style.opacity=0;
        index=(index+1)%slides.length;
        slides[index].style.opacity=1;
    },4000);
}

/* Love Letter Typing */
const message=`Nilanjan,

From the day you entered my life,
everything feels brighter and more beautiful.

You are my comfort, my happiness,
my safe place, and my forever.

I don’t just want you for today…
I want you for every tomorrow.

Will you stay with me forever?

Love,
Samriddhi ❤️`;

function typeLetter(){
    let i=0;
    let speed=40;
    function typing(){
        if(i<message.length){
            loveLetter.innerHTML+=message.charAt(i);
            i++;
            setTimeout(typing,speed);
        }
    }
    typing();
}

/* Fireworks */
function fireworks(){
    for(let i=0;i<25;i++){
        let fire=document.createElement("div");
        fire.classList.add("firework");
        fire.innerHTML="✨";
        fire.style.left=Math.random()*100+"vw";
        fire.style.top=Math.random()*100+"vh";
        document.body.appendChild(fire);
        setTimeout(()=>fire.remove(),1000);
    }
}
</script>

</body>
</html>
