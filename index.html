<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samriddhi ❤️ Nilanjan</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff4e8b,#ff0080);
overflow:hidden;
text-align:center;
color:white;
transition:0.6s;
}

.container{
max-width:600px;
padding:20px;
}

h1{
font-size:2.5rem;
margin-bottom:20px;
animation: float 2s ease-in-out infinite alternate;
}

@keyframes float{
from{transform:translateY(0);}
to{transform:translateY(-10px);}
}

.buttons{
margin-top:30px;
position:relative;
}

button{
padding:12px 25px;
font-size:18px;
border:none;
border-radius:40px;
cursor:pointer;
margin:10px;
transition:0.3s;
}

#yesBtn{
background:white;
color:#ff0080;
font-weight:bold;
}

#noBtn{
background:black;
color:white;
position:absolute;
}

.heart{
position:absolute;
bottom:-20px;
font-size:20px;
animation: rise 6s linear infinite;
opacity:0.8;
}

@keyframes rise{
0%{transform:translateY(0);}
100%{transform:translateY(-110vh);}
}

#finalScreen{
display:none;
animation: fadeIn 1s ease forwards;
}

@keyframes fadeIn{
from{opacity:0;}
to{opacity:1;}
}
</style>
</head>

<body>

<div class="container" id="mainScreen">
<h1 id="question">Nilanjan, will you be my Valentine? 💖</h1>

<div class="buttons">
<button id="yesBtn">YES 😍</button>
<button id="noBtn">NO 🙈</button>
</div>
</div>

<div class="container" id="finalScreen">
<h1>Samriddhi ❤️ Nilanjan</h1>
<h2>Forever & Always 💍</h2>
<p style="margin-top:20px;">
You are my today, my tomorrow and my forever.  
Thank you for saying YES 💖
</p>
</div>

<script>
const yesBtn=document.getElementById("yesBtn");
const noBtn=document.getElementById("noBtn");
const question=document.getElementById("question");
const mainScreen=document.getElementById("mainScreen");
const finalScreen=document.getElementById("finalScreen");

let yesSize=18;
let messages=[
"Are you sure? 🥺",
"Think again! 😅",
"Pleaseeee? 💕",
"I’ll be sad 🥹",
"Last chance 🙈"
];
let index=0;

/* Floating hearts */
for(let i=0;i<30;i++){
let heart=document.createElement("div");
heart.classList.add("heart");
heart.innerHTML="💖";
heart.style.left=Math.random()*100+"vw";
heart.style.animationDuration=(4+Math.random()*4)+"s";
heart.style.fontSize=(15+Math.random()*25)+"px";
document.body.appendChild(heart);
}

/* NO button moves */
noBtn.addEventListener("mouseover",()=>{
noBtn.style.top=Math.random()*300+"px";
noBtn.style.left=Math.random()*300+"px";

if(index < messages.length){
question.innerText=messages[index];
index++;
}

yesSize+=5;
yesBtn.style.fontSize=yesSize+"px";
yesBtn.style.padding=(12+index*2)+"px "+(25+index*5)+"px";
});

/* YES clicked */
yesBtn.addEventListener("click",()=>{
mainScreen.style.display="none";
finalScreen.style.display="block";
document.body.style.background="linear-gradient(135deg,#ff0080,#ffcc00)";
confetti();
});

/* Celebration hearts */
function confetti(){
for(let i=0;i<50;i++){
let heart=document.createElement("div");
heart.classList.add("heart");
heart.innerHTML="💘";
heart.style.left=Math.random()*100+"vw";
heart.style.animationDuration="3s";
document.body.appendChild(heart);
setTimeout(()=>heart.remove(),3000);
}
}
</script>

</body>
</html>
